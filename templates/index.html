<!DOCTYPE html>

<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>🧋 Order Drinks</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>

        * {
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: auto;
        }

        body {
            background: #F4EFEA;
            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            touch-action: manipulation;

            padding-bottom: 110px;
        }

        button,
        label,
        input,
        select {
            touch-action: manipulation;
        }

        .menu-card {
            background: #fff;
            border-radius: 14px;
            border: 1.5px solid #C8B2A2;
            overflow: hidden;
            contain: content;
        }

        .menu-image {
            height: 100px;
            width: 100%;
            object-fit: contain;
            background: #fafafa;
        }

        .topping-list {
            max-height: 150px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .topping-option {
            display: flex;
            align-items: center;
            gap: 8px;

            min-height: 38px;

            padding: 6px 8px;

            border-radius: 8px;

            background: #fafafa;

            border: 1px solid #eee;

            cursor: pointer;

            user-select: none;
        }

        .topping-option:active {
            transform: scale(0.98);
        }

        .topping-option input {
            width: 18px;
            height: 18px;

            accent-color: #92400e;

            flex-shrink: 0;
        }

        .topping-name {
            flex: 1;
            font-size: 12px;
            font-weight: 600;
        }

        .topping-price {
            font-size: 11px;
            color: #92400e;
            font-weight: 700;
        }

        .add-button {
            min-height: 42px;
        }

        .bottom-bar {
            padding-bottom:
                calc(12px + env(safe-area-inset-bottom));
        }

        .loading {
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {

            0% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.5;
            }

        }

    </style>

</head>


<body class="p-3">


<!-- =========================================================
     ภาษา
========================================================= -->

<div class="flex justify-end gap-1 mb-2">

    <button
        onclick="changeLang('th')"
        class="px-2 py-1 bg-amber-100 text-amber-900 rounded text-xs font-bold border border-amber-300"
    >
        🇹🇭 TH
    </button>

    <button
        onclick="changeLang('en')"
        class="px-2 py-1 bg-amber-100 text-amber-900 rounded text-xs font-bold border border-amber-300"
    >
        🇬🇧 EN
    </button>

    <button
        onclick="changeLang('zh')"
        class="px-2 py-1 bg-amber-100 text-amber-900 rounded text-xs font-bold border border-amber-300"
    >
        🇨🇳 ZH
    </button>

    <button
        onclick="changeLang('my')"
        class="px-2 py-1 bg-amber-100 text-amber-900 rounded text-xs font-bold border border-amber-300"
    >
        🇲🇲 MY
    </button>

</div>


<!-- =========================================================
     หัวข้อ
========================================================= -->

<div
    id="ui-title"
    class="bg-amber-800 text-white p-3 rounded-lg text-center font-bold mb-3 shadow"
>
    🧋 สั่งเครื่องดื่ม (กลับบ้าน)
</div>


<!-- =========================================================
     ชื่อลูกค้า / คิว
========================================================= -->

<div class="mb-3">

    <input
        id="tableNo"
        type="text"
        value="สั่งกลับบ้าน"
        autocomplete="off"
        class="w-full p-3 border border-amber-300 rounded-lg text-sm bg-white"
    >

</div>


<!-- =========================================================
     เมนู
========================================================= -->

<div
    id="menuContainer"
    class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3"


    <div
        class="col-span-full text-center text-gray-500 py-10 loading"
    >
        กำลังโหลดเมนู...
    </div>

</div>


<!-- =========================================================
     Bottom Cart
========================================================= -->

<div
    class="fixed bottom-0 left-0 right-0 bg-white border-t-2 border-amber-800 shadow-lg z-40 bottom-bar"


    <div class="p-3">

        <div class="flex justify-between items-center">

            <div>

                <div class="text-xs text-gray-500">

                    <span id="ui-total-label">
                        ราคารวม
                    </span>

                    (

                    <span id="cartCount">
                        0
                    </span>

                    <span id="ui-item-label">
                        รายการ
                    </span>

                    )

                </div>

                <div class="text-xl font-bold text-amber-900">

                    <span id="cartTotal">
                        0
                    </span>

                    ฿

                </div>

            </div>


            <div class="flex gap-2">

                <button
                    id="ui-view-cart-btn"
                    onclick="openCartModal()"
                    class="bg-amber-100 text-amber-900 border border-amber-300 px-3 py-3 rounded-lg text-xs font-bold"
                >
                    🛒 รายการ
                </button>

                <button
                    id="ui-submit-btn"
                    onclick="submitOrder()"
                    class="bg-amber-800 text-white px-4 py-3 rounded-lg font-bold text-sm"
                >
                    🚀 ยืนยันสั่งซื้อ
                </button>

            </div>

        </div>

    </div>

</div>


<!-- =========================================================
     Cart Modal
========================================================= -->

<div
    id="cartModal"
    class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden"


    <div
        class="bg-white w-full max-w-md rounded-xl p-4 shadow-2xl flex flex-col max-h-[80vh]"
    >

        <div
            class="flex justify-between items-center border-b pb-2 mb-3"
        >

            <h3
                id="ui-modal-title"
                class="font-bold text-amber-900 text-lg"
            >
                🛒 รายการในตะกร้า
            </h3>

            <button
                onclick="closeCartModal()"
                class="text-gray-400 font-bold text-2xl px-2"
            >
                &times;
            </button>

        </div>


        <div
            id="cartItemsList"
            class="flex-1 overflow-y-auto divide-y divide-gray-100 my-2"
        ></div>


        <div
            class="border-t pt-3 mt-2 flex justify-between items-center"
        >

            <button
                id="ui-clear-all-btn"
                onclick="clearCart()"
                class="text-red-600 border border-red-200 bg-red-50 px-3 py-2 rounded text-xs font-bold"
            >
                🗑️ ล้างทั้งหมด
            </button>

            <button
                id="ui-close-modal-btn"
                onclick="closeCartModal()"
                class="bg-amber-800 text-white px-4 py-2 rounded text-xs font-bold"
            >
                ปิด
            </button>

        </div>

    </div>

</div>


<script>

        alertErr:

};


// =========================================================
// ตัวแปร
// =========================================================

let currentLang = "th";

let menuData = [];

let toppingData = [];

let cart = [];

let isSubmitting = false;


// =========================================================
// Escape HTML
// ป้องกันชื่อเมนู/ท็อปปิ้งที่มีอักขระพิเศษ
// =========================================================

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// =========================================================
// เปลี่ยนภาษา
// =========================================================

function changeLang(lang) {

    currentLang = lang;

    const t = i18n[lang];

    document.getElementById(
        "ui-title"
    ).innerText = t.title;


    const tableInput =
        document.getElementById("tableNo");


    tableInput.placeholder =
        t.tablePlaceholder;


    if (
        Object.values(i18n).some(
            item =>
                item.tableDefault ===
                tableInput.value
        )
    ) {

        tableInput.value =
            t.tableDefault;

    }


    document.getElementById(
        "ui-total-label"
    ).innerText =
        t.totalLabel;


    document.getElementById(
        "ui-item-label"
    ).innerText =
        t.itemLabel;


    document.getElementById(
        "ui-submit-btn"
    ).innerText =
        t.submitBtn;


    document.getElementById(
        "ui-view-cart-btn"
    ).innerText =
        t.viewCartBtn;


    document.getElementById(
        "ui-modal-title"
    ).innerText =
        t.modalTitle;


    document.getElementById(
        "ui-clear-all-btn"
    ).innerText =
        t.clearAllBtn;


    document.getElementById(
        "ui-close-modal-btn"
    ).innerText =
        t.closeBtn;


    renderMenu();

    renderCartModal();

}


// =========================================================
// โหลดข้อมูล
// =========================================================

async function loadInitData() {

    try {

        const response =
            await fetch(
                "/api/init-data",
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Load failed"
            );

        }


        const data =
            await response.json();


        menuData =
            Array.isArray(data.menu)
                ? data.menu
                : [];


        toppingData =
            Array.isArray(data.toppings)
                ? data.toppings
                : [];


        renderMenu();

    }

    catch (error) {

        console.error(error);

        document.getElementById(
            "menuContainer"
        ).innerHTML = `

            <div
                class="col-span-full text-center text-red-500 py-10"
            >
                ${i18n[currentLang].errLoad}
            </div>

        `;

    }

}


// =========================================================
// สร้างรายการท็อปปิ้ง
// =========================================================

function buildToppings() {

    if (
        !toppingData ||
        toppingData.length === 0
    ) {

        return `
            <div class="text-xs text-gray-400 p-2">
                ${i18n[currentLang].noTopping}
            </div>
        `;

    }


    return toppingData
        .map(
            (top, topIndex) => {

                const name =
                    escapeHTML(top.name);

                const price =
                    Number(top.price || 0);


                return `

                    <label
                        class="topping-option"
                    >

                        <input
                            type="checkbox"
                            class="topping-check"
                            data-top-index="${topIndex}"
                        >

                        <span
                            class="topping-name"
                        >
                            ${name}
                        </span>

                        <span
                            class="topping-price"
                        >
                            +${price}฿
                        </span>

                    </label>

                `;

            }
        )
        .join("");

}


// =========================================================
// แสดงเมนู
//
// ใช้ innerHTML ครั้งเดียวตอนโหลด
// ไม่ render ใหม่ทุกครั้งที่กดสั่ง
// =========================================================

function renderMenu() {

    const container =
        document.getElementById(
            "menuContainer"
        );


    if (
        !menuData ||
        menuData.length === 0
    ) {

        container.innerHTML = `

            <div
                class="col-span-full text-center text-gray-500 py-10"
            >
                ไม่มีข้อมูลเมนู
            </div>

        `;

        return;

    }


    const t =
        i18n[currentLang];


    let html = "";


    for (
        let i = 0;
        i < menuData.length;
        i++
    ) {

        const item =
            menuData[i];


        const image =
            escapeHTML(
                item.image_url ||
                "https://via.placeholder.com/100"
            );


        const name =
            escapeHTML(item.name);


        const price =
            Number(item.price || 0);


        html += `

            <div
                class="menu-card shadow-sm"
                data-menu-index="${i}"
            >

                <img
                    src="${image}"
                    class="menu-image"
                    loading="lazy"
                    decoding="async"
                    onerror="this.style.display='none'"
                >


                <div class="p-2">

                    <div
                        class="font-bold text-sm text-gray-800 min-h-[40px]"
                    >
                        ${name}
                    </div>


                    <div
                        class="text-amber-800 font-extrabold text-sm mb-2"
                    >
                        ${price} ฿
                    </div>


                    <!-- ======================================
                         ท็อปปิ้งหลายรายการ
                    ======================================= -->

                    <div
                        class="text-xs font-bold text-gray-600 mb-1"
                    >
                        ${t.noTopping}
                    </div>


                    <div
                        class="topping-list space-y-1"
                    >

                        ${buildToppings()}

                    </div>


                    <!-- ======================================
                         ปุ่มสั่ง
                    ======================================= -->

                    <button
                        type="button"
                        class="add-button add-to-cart-btn w-full bg-amber-800 text-white text-xs font-bold py-2 rounded-lg mt-2 active:bg-amber-900 active:scale-[0.98]"
                        data-menu-index="${i}"
                    >
                        ${t.addBtn}
                    </button>

                </div>

            </div>

        `;

    }


    container.innerHTML =
        html;

}


// =========================================================
// Event Delegation
//
// มี listener เดียวสำหรับเมนูทั้งหมด
// ช่วยลดภาระบนมือถือ/แท็บเล็ต
// =========================================================

document
    .getElementById("menuContainer")
    .addEventListener(
        "click",
        function(event) {

            const button =
                event.target.closest(
                    ".add-to-cart-btn"
                );


            if (!button) {
                return;
            }


            const menuIndex =
                Number(
                    button.dataset.menuIndex
                );


            addToCart(
                menuIndex,
                button
            );

        }
    );


// =========================================================
// เพิ่มสินค้า
// =========================================================

function addToCart(
    menuIndex,
    button
) {

    const item =
        menuData[menuIndex];


    if (!item) {
        return;
    }


    const card =
        button.closest(
            ".menu-card"
        );


    const checked =
        card.querySelectorAll(
            ".topping-check:checked"
        );


    let totalPrice =
        Number(item.price || 0);


    const selectedToppings = [];


    // =====================================================
    // อ่านท็อปปิ้งทั้งหมดที่เลือก
    // =====================================================

    checked.forEach(
        checkbox => {

            const index =
                Number(
                    checkbox.dataset.topIndex
                );


            const topping =
                toppingData[index];


            if (!topping) {
                return;
            }


            const toppingPrice =
                Number(
                    topping.price || 0
                );


            totalPrice +=
                toppingPrice;


            selectedToppings.push({

                name:
                    topping.name,

                price:
                    toppingPrice

            });

        }
    );


    // =====================================================
    // สร้างชื่อสินค้า
    // =====================================================

    let displayName =
        item.name;


    if (
        selectedToppings.length > 0
    ) {

        const toppingNames =
            selectedToppings
                .map(
                    top =>
                        top.name
                )
                .join(", ");


        displayName +=
             (+${toppingNames});

    }


    // =====================================================
    // เพิ่มลง Cart
    // =====================================================

    cart.push({

        name:
            displayName,

        price:
            totalPrice,

        base_price:
            Number(item.price || 0),

        toppings:
            selectedToppings

    });


    updateCartUI();


    // =====================================================
    // รีเซ็ต Checkbox ท็อปปิ้ง
    // ของเมนูนี้ทันที
    // =====================================================

    checked.forEach(
        checkbox => {

            checkbox.checked =
                false;

        }
    );


    // =====================================================
    // Feedback ปุ่ม
    // =====================================================

    const originalText =
        button.innerText;


    button.innerText =
        "✓";


    button.disabled =
        true;


    setTimeout(
        () => {

            button.innerText =
                originalText;

            button.disabled =
                false;

        },
        250
    );

}


// =========================================================
// อัปเดต Cart
// =========================================================

function updateCartUI() {

    const count =
        cart.length;


    let total = 0;


    for (
        let i = 0;
        i < cart.length;
        i++
    ) {

        total +=
            Number(
                cart[i].price || 0
            );

    }


    document.getElementById(
        "cartCount"
    ).innerText =
        count;


    document.getElementById(
        "cartTotal"
    ).innerText =
        total;

}


// =========================================================
// รีเซ็ตท็อปปิ้งทั้งหมด
// =========================================================

function resetAllToppings() {

    document
        .querySelectorAll(
            ".topping-check"
        )
        .forEach(
            checkbox => {

                checkbox.checked =
                    false;

            }
        );

}


// =========================================================
// ลบสินค้า
// =========================================================

function removeFromCart(index) {

    if (
        index < 0 ||
        index >= cart.length
    ) {

        return;

    }


    cart.splice(
        index,
        1
    );


    updateCartUI();

    renderCartModal();

}


// =========================================================
// ล้าง Cart
// =========================================================

function clearCart() {

    cart = [];


    resetAllToppings();


    updateCartUI();

    renderCartModal();

    closeCartModal();

}


// =========================================================
// เปิด Cart
// =========================================================

function openCartModal() {

    renderCartModal();


    document
        .getElementById(
            "cartModal"
        )
        .classList
        .remove("hidden");

}


// =========================================================
// ปิด Cart
// =========================================================

function closeCartModal() {

    document
        .getElementById(
            "cartModal"
        )
        .classList
        .add("hidden");

}


// =========================================================
// แสดง Cart
// =========================================================

function renderCartModal() {

    const container =
        document.getElementById(
            "cartItemsList"
        );


    const t =
        i18n[currentLang];


    if (
        cart.length === 0
    ) {

        container.innerHTML = `

            <div
                class="text-center text-gray-400 py-8 text-sm"
            >
                ${t.emptyCartText}
            </div>

        `;

        return;

    }


    let html = "";


    for (
        let i = 0;
        i < cart.length;
        i++
    ) {

        const item =
            cart[i];


        html += `

            <div
                class="flex justify-between items-center py-3"
            >

                <div
                    class="pr-2 text-left"
                >

                    <div
                        class="font-bold text-sm text-gray-800"
                    >
                        ${escapeHTML(item.name)}
                    </div>

                    <div
                        class="text-xs text-amber-800 font-semibold mt-1"
                    >
                        ${Number(item.price)} ฿
                    </div>

                </div>


                <button
                    type="button"
                    onclick="removeFromCart(${i})"
                    class="bg-red-100 text-red-600 px-3 py-2 rounded-lg text-xs font-bold"
                >
                    ❌
                </button>

            </div>

        `;

    }


    container.innerHTML =
        html;

}


// =========================================================
// ส่งออเดอร์
// =========================================================

async function submitOrder() {

    if (isSubmitting) {
        return;
    }


    const t =
        i18n[currentLang];


    const tableNo =
        document.getElementById(
            "tableNo"
        ).value.trim();


    if (!tableNo) {

        alert(
            t.alertName
        );

        return;

    }


    if (
        cart.length === 0
    ) {

        alert(
            t.alertEmpty
        );

        return;

    }


    let total = 0;


    for (
        let i = 0;
        i < cart.length;
        i++
    ) {

        total +=
            Number(
                cart[i].price || 0
            );

    }


    // =====================================================
    // ป้องกันกดส่งซ้ำ
    // =====================================================

    isSubmitting =
        true;


    const submitButton =
        document.getElementById(
            "ui-submit-btn"
        );


    const oldText =
        submitButton.innerText;


    submitButton.disabled =
        true;


    submitButton.innerText =
        "⏳";


    try {

        const response =
            await fetch(
                "/api/order",
                {

                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            table_number:
                                tableNo,

                            cart:
                                cart,

                            total_price:
                                total

                        })

                }
            );


        const result =
            await response.json();


        if (
            !response.ok ||
            !result.success
        ) {

            throw new Error(
                result.error ||
                "Order failed"
            );

        }


        // =================================================
        // สำเร็จ
        // =================================================

        alert(
            t.alertSuccess
        );


        // ล้าง Cart

        cart = [];


        // รีเซ็ตท็อปปิ้งทั้งหมด

        resetAllToppings();


        // อัปเดตหน้าจอ

        updateCartUI();

        renderCartModal();

        closeCartModal();


    }

    catch (error) {

        console.error(
            error
        );


        alert(
            t.alertErr
        );

    }

    finally {

        isSubmitting =
            false;


        submitButton.disabled =
            false;


        submitButton.innerText =
            oldText;

    }

}


// =========================================================
// ปิด Modal เมื่อกดด้านนอก
// =========================================================

document
    .getElementById(
        "cartModal"
    )
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target ===
                this
            ) {

                closeCartModal();

            }

        }
    );


// =========================================================
// เริ่มระบบ
// =========================================================

loadInitData();

</script>
