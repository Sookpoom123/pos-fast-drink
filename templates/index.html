<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🧋 Drink Order</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#F4EFEA;font-family:Arial,sans-serif;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{padding:10px;padding-bottom:105px}
button,input,label{touch-action:manipulation}

/* เพิ่ม CSS Optimize สำหรับการเรนเดอร์ให้ลื่นไหล */
.menu-card {
  background:#fff;
  border-radius:14px;
  border:1.5px solid #C8B2A2;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  contain: content; /* กักบริเวณการเรนเดอร์ไม่ให้กระทบทั้งหน้า */
  will-change: transform;
}
.menu-image {
  width:100%;
  height:110px;
  object-fit:cover;
  background:#fafafa;
  border-radius:10px 10px 0 0;
}
.order-button{min-height:42px}
.language-button{min-width:62px;min-height:40px}
.loading{text-align:center;padding:40px 10px;color:#777}

.topping-item-modal {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px;
  border-bottom: 1px solid #f0f0f0;
}

@media (min-width:768px){
  body{padding:16px;padding-bottom:115px}
  .menu-image{height:140px}
}
</style>
</head>

<body>

<div class="bg-amber-800 text-white p-3 rounded-xl text-center font-bold mb-3 shadow">
  <div id="titleText" class="text-lg">🧋 สั่งเครื่องดื่ม</div>
  <div id="subtitleText" class="text-xs opacity-90 mt-1">สั่งกลับบ้าน</div>
</div>

<div class="bg-white rounded-xl p-2 mb-3 shadow-sm">
  <div id="languageText" class="text-xs text-gray-500 mb-2 text-center">ภาษา / Language</div>
  <div class="grid grid-cols-4 gap-2">
    <button id="lang-th" onclick="changeLanguage('th')" class="language-button rounded-lg border font-bold text-sm bg-amber-800 text-white">🇹🇭 ไทย</button>
    <button id="lang-my" onclick="changeLanguage('my')" class="language-button rounded-lg border font-bold text-sm bg-white">🇲🇲 မြန်မာ</button>
    <button id="lang-zh" onclick="changeLanguage('zh')" class="language-button rounded-lg border font-bold text-sm bg-white">🇨🇳 中文</button>
    <button id="lang-en" onclick="changeLanguage('en')" class="language-button rounded-lg border font-bold text-sm bg-white">🇬🇧 English</button>
  </div>
</div>

<div class="grid grid-cols-1 md:grid-cols-3 gap-2 mb-3">
  <div>
    <label id="dateLabel" class="block text-xs text-gray-600 mb-1 font-bold">📅 วันที่สั่งซื้อ:</label>
    <input id="orderDate" type="date" class="w-full p-2.5 border border-amber-300 rounded-xl text-sm bg-white shadow-sm font-semibold text-gray-700">
  </div>

  <div>
    <label id="customerLabel" class="block text-xs text-gray-600 mb-1 font-bold">👤 ชื่อลูกค้า/คิว:</label>
    <input id="tableNo" type="text" value="สั่งกลับบ้าน" class="w-full p-2.5 border border-amber-300 rounded-xl text-sm bg-white shadow-sm" placeholder="ระบุชื่อลูกค้า/คิว" autocomplete="off">
  </div>

  <div>
    <label id="searchLabel" class="block text-xs text-gray-600 mb-1 font-bold">🔍 ค้นหาเมนู:</label>
    <input id="searchInput" type="text" oninput="filterMenuFast()" class="w-full p-2.5 border border-amber-300 rounded-xl text-sm bg-white shadow-sm" placeholder="ค้นหา..." autocomplete="off">
  </div>
</div>

<div id="menuContainer" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
  <div class="loading col-span-full">กำลังโหลดเมนู...</div>
</div>

<!-- Floating Bottom Bar -->
<div class="fixed bottom-0 left-0 right-0 bg-white border-t-2 border-amber-800 p-3 shadow-lg z-40">
  <div class="max-w-7xl mx-auto flex justify-between items-center gap-3">
    <div onclick="openCartModal()" class="cursor-pointer flex-1">
      <div id="cartLabel" class="text-xs text-gray-500 underline decoration-amber-800 flex items-center gap-1">
        <span>ราคารวม (<span id="cartCount">0</span> <span id="itemText">รายการ</span>)</span>
        <span class="text-[10px] text-amber-800 font-bold">(ดู/ลบ)</span>
      </div>
      <div class="text-xl font-bold text-amber-900"><span id="cartTotal">0</span> ฿</div>
    </div>
    <button id="submitButton" onclick="submitOrder()" class="bg-amber-800 text-white px-5 py-3 rounded-xl font-bold active:scale-95 transition">
      🚀 <span id="submitText">ยืนยันสั่งซื้อ</span>
    </button>
  </div>
</div>

<!-- Modal เลือกท็อปปิ้ง (ช่วยลด DOM บน iPad ได้เยอะมาก) -->
<div id="toppingModal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
  <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-4 max-h-[80vh] flex flex-col shadow-2xl">
    <div class="flex justify-between items-center pb-2 border-b">
      <div>
        <h3 class="font-bold text-lg text-amber-900" id="toppingModalTitle">เมนู</h3>
        <p class="text-xs text-amber-700" id="toppingModalSub">เลือกท็อปปิ้ง</p>
      </div>
      <button onclick="closeToppingModal()" class="text-gray-400 text-2xl font-bold p-1">&times;</button>
    </div>
    
    <div id="toppingModalList" class="overflow-y-auto my-2 flex-1"></div>

    <div class="pt-2 border-t flex gap-2">
      <button onclick="confirmAddToCart()" class="w-full bg-amber-800 text-white font-bold py-3 rounded-xl text-sm active:scale-95 transition">
        ➕ ใส่ตะกร้า
      </button>
    </div>
  </div>
</div>

<!-- Modal ตะกร้าสินค้า -->
<div id="cartModal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
  <div class="bg-white w-full max-w-lg rounded-t-2xl sm:rounded-2xl p-4 max-h-[80vh] flex flex-col shadow-2xl">
    <div class="flex justify-between items-center pb-3 border-b">
      <h3 class="font-bold text-lg text-amber-900" id="cartModalTitle">🛒 รายการที่เลือก</h3>
      <button onclick="closeCartModal()" class="text-gray-400 text-2xl font-bold p-1">&times;</button>
    </div>
    
    <div id="cartItemsList" class="overflow-y-auto my-3 flex-1 divide-y"></div>

    <div class="pt-3 border-t flex gap-2">
      <button onclick="clearCart()" class="w-1/3 bg-red-100 text-red-700 font-bold py-2.5 rounded-xl text-sm">
        🗑️ ล้างทั้งหมด
      </button>
      <button onclick="closeCartModal()" class="w-2/3 bg-amber-800 text-white font-bold py-2.5 rounded-xl text-sm">
        ปิดหน้านี้
      </button>
    </div>
  </div>
</div>

<script>

let toppingData = [];
let cart = [];
let currentLanguage = localStorage.getItem("orderLanguage") || "th";
let submitting = false;
let activeMenuIndex = null; // บันทึกเมนูที่กำลังเลือกท็อปปิ้ง

const translationCache = {};

  "ไข่มุกสีทอง": { en: "Golden Pearl", zh: "金珍珠", my: "ရွှေပုလဲ" },
  "ฟรุ้ตสลัด": { en: "Fruit Salad", zh: "水果沙拉", my: "သစ်သီးသုပ်" },
  "บุกนมสด": { en: "Fresh Milk Jelly", zh: "鲜奶魔芋", my: "နို့စိမ်းဂျယ်လီ" },
  "บุกเฉาก๊วย": { en: "Grass Jelly", zh: "烧仙草", my: "ကျောက်ကျော" },
  "บุกน้ำผึ้ง": { en: "Honey Jelly", zh: "蜂蜜魔芋", my: "ပျားရည်ဂျယ်လီ" },
  "บุกบราวน์ชูการ์": { en: "Brown Sugar Jelly", zh: "黑糖魔芋", my: "ဂျယ်လီအညို" }

const translations = {
  th:{
    title:"🧋 สั่งเครื่องดื่ม", subtitle:"สั่งกลับบ้าน", language:"ภาษา / Language",
    dateLabel:"📅 วันที่สั่งซื้อ:", customerLabel:"👤 ชื่อลูกค้า/คิว:", searchLabel:"🔍 ค้นหาเมนู:",
    customerPlaceholder:"ระบุชื่อลูกค้า/คิว", searchPlaceholder:"ค้นหา...", noTopping:"ไม่ใส่ท็อปปิ้ง",
    selectTopping:"เลือกท็อปปิ้ง", order:"สั่ง", total:"ราคารวม",
    item:"รายการ", confirm:"ยืนยันสั่งซื้อ", loading:"กำลังโหลดเมนู...",
    loadingError:"โหลดข้อมูลเมนูไม่สำเร็จ", enterCustomer:"กรุณากรอกชื่อ/คิว",
    emptyCart:"ยังไม่ได้เลือกรายการ", success:"🎉 ส่งออเดอร์เรียบร้อย!",
    error:"เกิดข้อผิดพลาดในการส่งออเดอร์", sending:"กำลังส่ง...",
    cartTitle:"🛒 รายการที่เลือก", remove:"ลบ", clearAll:"🗑️ ล้างทั้งหมด",
    close:"ปิดหน้านี้", viewDelete:"(ดู/ลบ)", noMenuFound:"ไม่พบเมนูที่ค้นหา"
  },
  my:{
    title:"🧋 အဖျော်ယမကာ မှာယူရန်", subtitle:"အိမ်ယူရန်", language:"ဘာသာစကား / Language",
    dateLabel:"📅 ရက်စွဲ:", customerLabel:"👤 အမည် / ကူပွန်:", searchLabel:"🔍 ရှာရန်:",
    customerPlaceholder:"ဖောက်သည်အမည် / နံပါတ်", searchPlaceholder:"ရှာရန်...", noTopping:"Topping မထည့်ပါ",
    selectTopping:"Topping ရွေးမည်", order:"မှာယူမည်", total:"စုစုပေါင်း",
    item:"รายการ", confirm:"အော်ဒါတင်မည်", loading:"မီနူးများ ဖွင့်နေသည်...",
    loadingError:"မီနူးဒေတာ ဖွင့်၍မရပါ", enterCustomer:"ဖောက်သည်အမည် / နံပါတ် ထည့်ပါ",
    emptyCart:"ပစ္စည်းမရွေးရသေးပါ", success:"🎉 အော်ဒါတင်ပြီးပါပြီ!",
    error:"အော်ဒါပို့ရာတွင် အမှားဖြစ်နေပါသည်", sending:"ပို့နေသည်...",
    cartTitle:"🛒 ရွေးချယ်ထားသော ပစ္စည်းများ", remove:"ဖျက်မည်", clearAll:"🗑️ အားလုံးဖျက်မည်",
    close:"ပိတ်မည်", viewDelete:"(ကြည့်/ဖျက်)", noMenuFound:"မီနူး မတွေ့ပါ"
  },
  zh:{
    title:"🧋 饮料点单", subtitle:"外带", language:"语言 / Language",
    dateLabel:"📅 点单日期:", customerLabel:"👤 顾客姓名/号码:", searchLabel:"🔍 搜索飲料:",
    customerPlaceholder:"请输入顾客姓名/号码", searchPlaceholder:"搜索...", noTopping:"不加配料",
    selectTopping:"选择配料", order:"下单", total:"总价", item:"项",
    confirm:"确认下单", loading:"กำลัง加载菜单...", loadingError:"菜单加载失败",
    enterCustomer:"请输入顾客姓名/号码", emptyCart:"还没有选择商品",
    success:"🎉 订单提交成功！", error:"订单提交失败", sending:"正在提交...",
    cartTitle:"🛒 已选商品", remove:"删除", clearAll:"🗑️ 清空",
    close:"关闭", viewDelete:"(查看/删除)", noMenuFound:"未找到相关饮料"
  },
  en:{
    title:"🧋 Drink Order", subtitle:"Take Away", language:"Language",
    dateLabel:"📅 Order Date:", customerLabel:"👤 Name / Queue:", searchLabel:"🔍 Search:",
    customerPlaceholder:"Customer name / Queue", searchPlaceholder:"Search...", noTopping:"No toppings",
    selectTopping:"Select Toppings", order:"Order", total:"Total",
    item:"items", confirm:"Confirm Order", loading:"Loading menu...",
    loadingError:"Unable to load menu", enterCustomer:"Please enter customer name / queue",
    emptyCart:"Please select an item", success:"🎉 Order submitted successfully!",
    error:"Failed to submit order", sending:"Sending...",
    cartTitle:"🛒 Selected Items", remove:"Delete", clearAll:"🗑️ Clear All",
    close:"Close", viewDelete:"(View/Delete)", noMenuFound:"No menu found"
  }
};

function t(key){
  return (translations[currentLanguage] && translations[currentLanguage][key]) || translations.th[key] || key;
}

function setDefaultDate() {
  document.getElementById("orderDate").value = new Date().toISOString().split('T')[0];
}

async function batchTranslateTexts(texts, targetLang) {
  if (!texts.length || targetLang === "th") return {};
  const langCode = targetLang === "my" ? "my" : targetLang;
  const missingTexts = texts.filter(t => !translationCache[`${t}_${langCode}`] && !itemDictionary[t]?.[targetLang]);
  
  if (missingTexts.length > 0) {
    try {
      const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=th&tl=${langCode}&dt=t&q=${encodeURIComponent(missingTexts.join(" ||| "))}`;
      const response = await fetch(url);
      const result = await response.json();
      if (result && result[0]) {
        const translatedArray = result[0].map(item => item[0]).join('').split("|||");
        missingTexts.forEach((originalText, index) => {
          translationCache[`${originalText}_${langCode}`] = translatedArray[index] ? translatedArray[index].trim() : originalText;
        });
      }
    } catch (e) { console.warn("Translate Error:", e); }
  }

  const resultMap = {};
  texts.forEach(text => {
    resultMap[text] = itemDictionary[text]?.[targetLang] || translationCache[`${text}_${langCode}`] || text;
  });
  return resultMap;
}

function getMenuName(item){
  if(currentLanguage === "th") return item.name;
  return itemDictionary[item.name]?.[currentLanguage] || translationCache[`${item.name}_${currentLanguage}`] || item.name;
}

function getToppingName(item){
  if(currentLanguage === "th") return item.name;
  return itemDictionary[item.name]?.[currentLanguage] || translationCache[`${item.name}_${currentLanguage}`] || item.name;
}

async function changeLanguage(language){
  currentLanguage = language;
  localStorage.setItem("orderLanguage", language);
  updateLanguageButtons();
  updateStaticTexts();
  
  if(language !== "th") {
    const allTexts = [...menuData.map(m => m.name), ...toppingData.map(t => t.name)];
    await batchTranslateTexts(allTexts, language);
  }
  renderMenu();
}

function updateLanguageButtons(){
  ["th","my","zh","en"].forEach(lang=>{
    const button=document.getElementById(`lang-${lang}`);
    if(button) {
      button.className = lang===currentLanguage
        ? "language-button rounded-lg border font-bold text-sm bg-amber-800 text-white"
        : "language-button rounded-lg border font-bold text-sm bg-white";
    }
  });
}

function updateStaticTexts(){
  document.getElementById("titleText").innerText=t("title");
  document.getElementById("subtitleText").innerText=t("subtitle");
  document.getElementById("languageText").innerText=t("language");
  document.getElementById("dateLabel").innerText=t("dateLabel");
  document.getElementById("customerLabel").innerText=t("customerLabel");
  document.getElementById("searchLabel").innerText=t("searchLabel");
  document.getElementById("tableNo").placeholder=t("customerPlaceholder");
  document.getElementById("searchInput").placeholder=t("searchPlaceholder");
  document.getElementById("submitText").innerText=t("confirm");
  document.getElementById("cartModalTitle").innerText=t("cartTitle");
  updateCartUI();
}

async function loadInitData(){
  try{
    const response = await fetch("/api/init-data",{method:"GET",cache:"no-store"});
    const data = await response.json();
    if(!response.ok || !data.success) throw new Error(data.error || "Load error");

    menuData = Array.isArray(data.menu) ? data.menu : [];
    toppingData = Array.isArray(data.toppings) ? data.toppings : [];
    
    if(currentLanguage !== "th") {
      const allTexts = [...menuData.map(m => m.name), ...toppingData.map(t => t.name)];
      await batchTranslateTexts(allTexts, currentLanguage);
    }
    renderMenu();
  }catch(error){
    console.error(error);
    document.getElementById("menuContainer").innerHTML = `<div class="col-span-full text-center p-10 text-red-600">❌ ${escapeHTML(t("loadingError"))}</div>`;
  }
}

// ค้นหาแบบรวดเร็ว ไม่ทำลาย DOM
function filterMenuFast() {
  const keyword = (document.getElementById("searchInput")?.value || "").toLowerCase().trim();
  const cards = document.querySelectorAll('.menu-card');
  
  cards.forEach(card => {
    const name = card.getAttribute('data-name').toLowerCase();
    if (name.includes(keyword)) {
      card.classList.remove('hidden');
    } else {
      card.classList.add('hidden');
    }
  });
}

function renderMenu(){
  const container = document.getElementById("menuContainer");
  if(!menuData.length){
    container.innerHTML = `<div class="col-span-full loading">${escapeHTML(t("loadingError"))}</div>`;
    return;
  }

  // สร้างเฉพาะการ์ดเมนูเบาๆ ไม่ใส่ Topping DOM ซ้ำๆ
  container.innerHTML = menuData.map((item, index) => {
    const name = getMenuName(item);
    return `
      <div class="menu-card p-2" data-name="${escapeAttribute(name)} ${escapeAttribute(item.name)}">
        <div>
          <img src="${escapeAttribute(item.image_url || "https://via.placeholder.com/300")}" class="menu-image" loading="lazy" alt="">
          <div class="p-1">
            <div class="font-bold text-sm text-gray-800 line-clamp-1 mt-1">${escapeHTML(name)}</div>
            <div class="text-amber-800 font-extrabold mt-0.5">${formatPrice(item.price)} ฿</div>
          </div>
        </div>
        <button onclick="openToppingModal(${index})" class="order-button w-full bg-amber-800 text-white text-sm font-bold py-2 rounded-lg mt-2 active:scale-95 transition">
          ➕ ${escapeHTML(t("order"))}
        </button>
      </div>`;
  }).join("");
}

// ระบบเลือก ท็อปปิ้ง ผ่าน Modal
function openToppingModal(index) {
  activeMenuIndex = index;
  const item = menuData[index];
  if(!item) return;

  document.getElementById("toppingModalTitle").innerText = getMenuName(item);
  document.getElementById("toppingModalSub").innerText = `${formatPrice(item.price)} ฿`;
  
  const listContainer = document.getElementById("toppingModalList");
  if(!toppingData.length) {
    listContainer.innerHTML = `<div class="text-center text-gray-400 py-4">${t("noTopping")}</div>`;
  } else {
    listContainer.innerHTML = toppingData.map((top, tIdx) => `
      <label class="topping-item-modal cursor-pointer hover:bg-amber-50 rounded-lg">
        <div class="flex items-center gap-3">
          <input type="checkbox" class="topping-modal-cb w-5 h-5 text-amber-800 rounded" value="${tIdx}">
          <span class="text-sm font-medium text-gray-700">${escapeHTML(getToppingName(top))}</span>
        </div>
        <span class="text-xs font-bold text-amber-800">+${formatPrice(top.price)} ฿</span>
      </label>
    `).join("");
  }

  document.getElementById("toppingModal").classList.remove("hidden");
}

function closeToppingModal() {
  document.getElementById("toppingModal").classList.add("hidden");
  activeMenuIndex = null;
}

function confirmAddToCart() {
  if (activeMenuIndex === null) return;
  const item = menuData[activeMenuIndex];
  
  const selectedToppings = [];
  document.querySelectorAll('.topping-modal-cb:checked').forEach(cb => {
    const top = toppingData[Number(cb.value)];
    if(top) selectedToppings.push({ name: top.name, price: Number(top.price) });
  });

  const totalPrice = Number(item.price) + selectedToppings.reduce((sum, t) => sum + Number(t.price), 0);

  cart.push({
    menu_name: item.name,
    price: Number(item.price),
    toppings: selectedToppings,
    total_price: totalPrice
  });

  updateCartUI();
  closeToppingModal();
}

function removeFromCart(index){
  cart.splice(index, 1);
  updateCartUI();
  renderCartModal();
  if(!cart.length) closeCartModal();
}

function clearCart(){
  cart = [];
  updateCartUI();
  closeCartModal();
}

function openCartModal(){
  if(!cart.length) return;
  renderCartModal();
  document.getElementById("cartModal").classList.remove("hidden");
}

function closeCartModal(){
  document.getElementById("cartModal").classList.add("hidden");
}

function renderCartModal(){
  const container = document.getElementById("cartItemsList");
  if(!cart.length){
    container.innerHTML = `<div class="text-center py-6 text-gray-400">${t("emptyCart")}</div>`;
    return;
  }

  container.innerHTML = cart.map((item, index) => {
    const name = getMenuName({name: item.menu_name});
    const toppingsList = item.toppings.map(t => getToppingName({name: t.name})).join(", ");
    
    return `
      <div class="py-2.5 flex justify-between items-center gap-2">
        <div class="flex-1">
          <div class="font-bold text-sm text-gray-800">${escapeHTML(name)}</div>
          ${toppingsList ? `<div class="text-xs text-amber-700 mt-0.5">+ ${escapeHTML(toppingsList)}</div>` : ''}
          <div class="text-xs font-bold text-amber-900 mt-1">${formatPrice(item.total_price)} ฿</div>
        </div>
        <button onclick="removeFromCart(${index})" class="bg-red-50 text-red-600 px-3 py-1.5 rounded-lg text-xs font-bold border border-red-200">
          🗑️ ${t("remove")}
        </button>
      </div>`;
  }).join("");
}

function updateCartUI(){
  const count = cart.length;
  const total = cart.reduce((sum, item) => sum + Number(item.total_price), 0);

  document.getElementById("cartLabel").innerHTML =
    `<span>${escapeHTML(t("total"))} (<span id="cartCount">${count}</span> ${escapeHTML(t("item"))})</span> <span class="text-[10px] text-amber-800 font-bold">${t("viewDelete")}</span>`;
  document.getElementById("cartTotal").innerText = formatPrice(total);
}

async function submitOrder(){
  if(submitting) return;
  const tableNo = document.getElementById("tableNo").value.trim();
  const orderDate = document.getElementById("orderDate").value;

  if(!tableNo){ alert(t("enterCustomer")); return; }
  if(!cart.length){ alert(t("emptyCart")); return; }

  const total = cart.reduce((sum, item) => sum + Number(item.total_price), 0);
  submitting = true;

  const button = document.getElementById("submitButton");
  button.disabled = true;
  button.classList.add("opacity-60");
  document.getElementById("submitText").innerText = t("sending");

  const formattedCart = cart.map(item => {
    const toppingNames = item.toppings ? item.toppings.map(t => t.name).join(", ") : "";
    const fullName = toppingNames ? `${item.menu_name} (+${toppingNames})` : item.menu_name;
    return { name: fullName, display_name: fullName, price: item.total_price, cost: item.price };
  });

  try{
    const response = await fetch("/api/order",{
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        table_number: tableNo,
        cart: formattedCart,
        total_price: total,
        order_date: orderDate
      })
    });

    const data = await response.json();
    if(!response.ok || !data.success) throw new Error(data.error || "Order error");

    cart = [];
    document.getElementById("searchInput").value = "";
    filterMenuFast();
    updateCartUI();
    setDefaultDate();
    alert(t("success"));
  }catch(error){
    console.error(error);
    alert(t("error") + "\n" + error.message);
  }finally{
    submitting = false;
    button.disabled = false;
    button.classList.remove("opacity-60");
    document.getElementById("submitText").innerText = t("confirm");
  }
}

function formatPrice(price){
  return (Number(price)||0).toLocaleString("en-US",{maximumFractionDigits:2});
}

function escapeHTML(value){
  if(!value) return "";
  return String(value).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}

function escapeAttribute(value){ return escapeHTML(value); }

setDefaultDate();
updateLanguageButtons();
updateStaticTexts();
loadInitData();
</script>

</body>
</html>
