<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สั่งเครื่องดื่ม / Drink Order</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #F4EFEA; font-family: sans-serif; touch-action: manipulation; }
        .card { background: white; border-radius: 12px; border: 1.5px solid #C8B2A2; }
    </style>
</head>
<body class="p-3 max-w-md mx-auto">

    <!-- Header & Language Selector -->
    <div class="bg-amber-800 text-white p-3 rounded-lg flex justify-between items-center mb-3 shadow">
        <div class="font-bold text-lg" id="txt-title">🥤 สั่งเครื่องดื่ม</div>
        <select id="langSelect" onchange="changeLanguage()" class="text-black text-sm p-1 rounded font-bold bg-white border">
            <option value="th">🇹🇭 TH</option>
            <option value="my">🇲🇲 MY (พม่า)</option>
            <option value="zh">🇨🇳 ZH (จีน)</option>
            <option value="en">🇬🇧 EN</option>
        </select>
    </div>

    <!-- Date & Table Selection -->
    <div class="bg-white p-3 rounded-lg border mb-3 shadow-sm space-y-2">
        <div>
            <label class="text-xs text-gray-500 font-bold block mb-1" id="lbl-date">📅 วันที่สั่งซื้อ:</label>
            <input type="date" id="orderDate" class="w-full p-2 border rounded-lg text-sm bg-gray-50">
        </div>
        <div>
            <label class="text-xs text-gray-500 font-bold block mb-1" id="lbl-table">🏷️ ระบุชื่อลูกค้า / คิว / โต๊ะ:</label>
            <input type="text" id="tableNo" value="กลับบ้าน" class="w-full p-2 border border-amber-300 rounded-lg text-sm">
        </div>
    </div>

    <!-- Drink List -->
    <div id="drink-list" class="space-y-4 mb-20"></div>

    <!-- Cart Bar -->
    <div class="fixed bottom-0 left-0 right-0 p-3 bg-white border-t max-w-md mx-auto shadow-lg flex justify-between items-center">
        <div>
            <span class="text-xs text-gray-500 block" id="lbl-total-items">รายการทั้งหมด</span>
            <span id="cart-count" class="font-bold text-lg text-amber-900">0 รายการ</span>
        </div>
        <button onclick="submitOrder()" class="bg-green-600 text-white px-6 py-2.5 rounded-xl font-bold shadow text-lg hover:bg-green-700 active:scale-95" id="btn-submit">
            ✅ ยืนยันสั่งซื้อ
        </button>
    </div>

    <script>
        let translations = {
            th: { title: "🥤 สั่งเครื่องดื่ม", date: "📅 วันที่สั่งซื้อ:", table: "🏷️ ระบุชื่อลูกค้า / คิว / โต๊ะ:", items: "รายการทั้งหมด", submit: "✅ ยืนยันสั่งซื้อ", add: "+ สั่ง", noTopping: "ไม่ใส่ท็อปปิ้ง", success: "ส่งออเดอร์เรียบร้อยแล้ว!" },
            my: { title: "🥤 အဖျော်ယမကာ မှာယူရန်", date: "📅 မှာယူသည့်ရက်စွဲ:", table: "🏷️ ဝယ်သူအမည် / တိုကင်:", items: "စုစုပေါင်း ပစ္စည်းများ", submit: "✅ အတည်ပြုမည်", add: "+ မှာမည်", noTopping: "ထပ်ဖြည့်ပစ္စည်း မပါပါ", success: "မှာယူမှု အောင်မြင်ပါသည်။" },
            zh: { title: "🥤 点饮料", date: "📅 订购日期:", table: "🏷️ 客户姓名 / 编号:", items: "总计项目", submit: "✅ 确认订单", add: "+ 点餐", noTopping: "不加配料", success: "订单发送成功！" },
            en: { title: "🥤 Order Drinks", date: "📅 Order Date:", table: "🏷️ Customer / Queue:", items: "Total Items", submit: "✅ Submit Order", add: "+ Add", noTopping: "No Topping", success: "Order submitted!" }
        };

        let currentLang = 'th';
        let cart = [];
        let drinksData = [];
        let toppingsData = [];

        // Set Default Date to Today
        document.getElementById('orderDate').valueAsDate = new Date();

        async function init() {
            try {
                const res = await fetch('/api/data');
                const data = await res.json();
                drinksData = data.drinks;
                toppingsData = data.toppings;
                renderMenu();
            } catch (err) {
                console.error("Error fetching data:", err);
            }
        }

        function changeLanguage() {
            currentLang = document.getElementById('langSelect').value;
            const t = translations[currentLang];
            document.getElementById('txt-title').innerText = t.title;
            document.getElementById('lbl-date').innerText = t.date;
            document.getElementById('lbl-table').innerText = t.table;
            document.getElementById('lbl-total-items').innerText = t.items;
            document.getElementById('btn-submit').innerText = t.submit;
            renderMenu();
        }

        function renderMenu() {
            const container = document.getElementById('drink-list');
            container.innerHTML = '';
            const t = translations[currentLang];

            drinksData.forEach(d => {
                let toppingOptions = `<option value="">${t.noTopping}</option>`;
                toppingsData.forEach(top => {
                    toppingOptions += `<option value="${top.name}" data-price="${top.price}">${top.name} (+${top.price}฿)</option>`;
                });

                container.innerHTML += `
                    <div class="card p-3 shadow-sm text-center">
                        <img src="${d.image}" class="w-full h-36 object-cover rounded-lg mb-2" alt="${d.name}">
                        <div class="font-bold text-lg">${d.name}</div>
                        <div class="text-amber-800 font-bold text-md mb-2">${d.price} ฿</div>
                        <select id="top-${d.id}" class="w-full p-2 border rounded-lg text-sm mb-2 bg-gray-50">
                            ${toppingOptions}
                        </select>
                        <button onclick="addToCart(${d.id}, '${d.name}', ${d.price})" class="w-full bg-amber-800 text-white py-2 rounded-lg font-bold active:scale-95">
                            ${t.add}
                        </button>
                    </div>
                `;
            });
        }

        function addToCart(id, name, price) {
            const topSelect = document.getElementById(`top-${id}`);
            const selectedOpt = topSelect.options[topSelect.selectedIndex];
            const topName = selectedOpt.value;
            const topPrice = parseFloat(selectedOpt.getAttribute('data-price') || 0);

            cart.push({
                drink_name: name,
                price: price,
                topping_name: topName,
                topping_price: topPrice,
                total: price + topPrice
            });

            // เด้งกลับเป็น "ไม่ใส่ท็อปปิ้ง"
            topSelect.selectedIndex = 0;

            document.getElementById('cart-count').innerText = `${cart.length} รายการ`;
        }

        async function submitOrder() {
            if (cart.length === 0) return alert('กรุณาเลือกเมนูก่อนครับ');

            const tableNo = document.getElementById('tableNo').value;
            const orderDate = document.getElementById('orderDate').value;

            await fetch('/api/order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    table: tableNo,
                    date: orderDate,
                    items: cart
                })
            });

            alert(translations[currentLang].success);
            cart = [];
            document.getElementById('cart-count').innerText = '0 รายการ';
        }

        init();
    </script>
</body>
</html>
