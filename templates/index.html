<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧋 สั่งเครื่องดื่ม</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #F4EFEA; font-family: sans-serif; touch-action: manipulation; }
        .card { background: white; border-radius: 12px; border: 1.5px solid #C8B2A2; }
    </style>
</head>
<body class="p-3">

    <div class="bg-amber-800 text-white p-3 rounded-lg text-center font-bold mb-3 shadow">
        🧋 สั่งเครื่องดื่ม (กลับบ้าน)
    </div>

    <div class="mb-3">
        <input id="tableNo" type="text" value="สั่งกลับบ้าน" class="w-full p-2 border border-amber-300 rounded-lg text-sm" placeholder="ระบุชื่อลูกค้า/คิว">
    </div>

    <div id="menuContainer" class="grid grid-cols-2 md:grid-cols-3 gap-3 mb-24"></div>

    <div class="fixed bottom-0 left-0 right-0 bg-white border-t-2 border-amber-800 p-3 flex justify-between items-center shadow-lg z-50">
        <div>
            <div class="text-xs text-gray-500">ราคารวม (<span id="cartCount">0</span> รายการ)</div>
            <div class="text-xl font-bold text-amber-900"><span id="cartTotal">0</span> ฿</div>
        </div>
        <button onclick="submitOrder()" class="bg-amber-800 text-white px-6 py-2 rounded-lg font-bold hover:bg-amber-900 active:scale-95 transition">
            🚀 ยืนยันสั่งซื้อ
        </button>
    </div>

    <script>
        let menuData = [];
        let toppingData = [];
        let cart = [];

        async function loadInitData() {
            try {
                const res = await fetch('/api/init-data');
                const data = await res.json();
                menuData = data.menu;
                toppingData = data.toppings;
                renderMenu();
            } catch (err) {
                alert('โหลดข้อมูลเมนูไม่สำเร็จ');
            }
        }

        function renderMenu() {
            const container = document.getElementById('menuContainer');
            container.innerHTML = menuData.map((item, idx) => `
                <div class="card p-2 text-center flex flex-col justify-between">
                    <div>
                        <img src="${item.image_url || 'https://via.placeholder.com/100'}" class="h-24 w-full object-contain mb-1 rounded">
                        <div class="font-bold text-sm text-gray-800">${item.name}</div>
                        <div class="text-amber-800 font-extrabold text-sm">${item.price} ฿</div>
