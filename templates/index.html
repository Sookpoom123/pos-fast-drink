<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧋 สั่งเครื่องดื่ม</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #F4EFEA; font-family: sans-serif; touch-action: manipulation; }
        .card { background: white; border-radius: 12px; border: 1.5px solid #C8B2A2; }
    </style>
</head>
<body class="p-3">

    <div class="bg-amber-800 text-white p-3 rounded-lg text-center font-bold mb-3 shadow">
        🧋 สั่งเครื่องดื่ม (กลับบ้าน)
    </div>

    <div class="mb-3">
        <input id="tableNo" type="text" value="สั่งกลับบ้าน" class="w-full p-2 border border-amber-300 rounded-lg text-sm" placeholder="ระบุชื่อลูกค้า/คิว">
    </div>

    <div id="menuContainer" class="grid grid-cols-2 md:grid-cols-3 gap-3 mb-24"></div>

    <div class="fixed bottom-0 left-0 right-0 bg-white border-t-2 border-amber-800 p-3 flex justify-between items-center shadow-lg z-50">
        <div>
            <div class="text-xs text-gray-500">ราคารวม (<span id="cartCount">0</span> รายการ)</div>
            <div class="text-xl font-bold text-amber-900"><span id="cartTotal">0</span> ฿</div>
        </div>
        <button onclick="submitOrder()" class="bg-amber-800 text-white px-6 py-2 rounded-lg font-bold hover:bg-amber-900 active:scale-95 transition">
            🚀 ยืนยันสั่งซื้อ
        </button>
    </div>

    <script>
        let menuData = [];
        let toppingData = [];
        let cart = [];

        async function loadInitData() {
            try {
                const res = await fetch('/api/init-data');
                const data = await res.json();
                menuData = data.menu;
                toppingData = data.toppings;
                renderMenu();
            } catch (err) {
                alert('โหลดข้อมูลเมนูไม่สำเร็จ');
            }
        }

        function renderMenu() {
            const container = document.getElementById('menuContainer');
            container.innerHTML = menuData.map((item, idx) => `
                <div class="card p-2 text-center flex flex-col justify-between">
                    <div>
                        <img src="${item.image_url || 'https://via.placeholder.com/100'}" class="h-24 w-full object-contain mb-1 rounded">
                        <div class="font-bold text-sm text-gray-800">${item.name}</div>
                        <div class="text-amber-800 font-extrabold text-sm">${item.price} ฿</div>
                    </div>
                    
                    <select id="topping-${idx}" class="w-full text-xs p-1 border rounded mt-2 bg-gray-50">
                        <option value="">-- ไม่ใส่ท็อปปิ้ง --</option>
                        ${toppingData.map(t => `<option value="${t.name}|${t.price}">${t.name} (+${t.price}฿)</option>`).join('')}
                    </select>

                    <button onclick="addToCart(${idx})" class="w-full bg-amber-800 text-white text-xs font-bold py-2 rounded mt-2 active:bg-amber-900 active:scale-95 transition">
                        ➕ สั่ง
                    </button>
                </div>
            `).join('');
        }

        function addToCart(menuIdx) {
            const item = menuData[menuIdx];
            const toppingSelect = document.getElementById(`topping-${menuIdx}`);
            let price = item.price;
            let name = item.name;

            if (toppingSelect.value) {
                const [topName, topPrice] = toppingSelect.value.split('|');
                price += parseFloat(topPrice);
                name += ` (+${topName})`;
            }

            cart.push({ name, price });
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cartCount').innerText = cart.length;
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('cartTotal').innerText = total;
        }

        async function submitOrder() {
            const tableNo = document.getElementById('tableNo').value;
            if (!tableNo.trim()) return alert('กรุณากรอกชื่อ/คิว');
            if (cart.length === 0) return alert('ยังไม่ได้เลือกรายการ');

            const total = cart.reduce((sum, item) => sum + item.price, 0);

            try {
                const res = await fetch('/api/order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ table_number: tableNo, cart: cart, total_price: total })
                });

                if (res.ok) {
                    alert('🎉 ส่งออเดอร์เรียบร้อย!');
                    cart = [];
                    updateCartUI();
                }
            } catch (err) {
                alert('เกิดข้อผิดพลาดในการส่งออเดอร์');
            }
        }

        loadInitData();
    </script>
</body>
</html>
