/* =====================================================
   Helper

function t(key){

  return
    (translations[currentLanguage] &&
     translations[currentLanguage][key])
    ||
    translations.th[key]
    ||
    key;

}

/* =====================================================
   Translate
===================================================== */

async function batchTranslateTexts(texts,targetLang){

  if(
    !texts.length ||
    targetLang === "th"
  ){
    return {};
  }


  const langCode =
    targetLang === "my"
      ? "my"
      : targetLang;


  const uniqueTexts =
    [...new Set(
      texts.filter(Boolean)
    )];


  const missingTexts =
    uniqueTexts.filter(text =>

      !translationCache[
        `${text}_${langCode}`
      ]

      &&

      !itemDictionary[text]?.[targetLang]

    );


  if(missingTexts.length > 0){

    const combinedText =
      missingTexts.join(" ||| ");


    try{

      const url =
        `https://translate.googleapis.com/translate_a/single?client=gtx&sl=th&tl=${langCode}&dt=t&q=${encodeURIComponent(combinedText)}`;


      const response =
        await fetch(url);


      const result =
        await response.json();


      if(result && result[0]){

        const fullTranslatedText =
          result[0]
            .map(item => item[0])
            .join("");


        const translatedArray =
          fullTranslatedText
            .split("|||");


        missingTexts.forEach(
          (originalText,index) => {

            translationCache[
              `${originalText}_${langCode}`
            ] =

              translatedArray[index]
                ? translatedArray[index].trim()
                : originalText;

          }
        );

      }

    }catch(error){

      console.warn(
        "Batch translate error:",
        error
      );

    }

  }


  const resultMap = {};


  uniqueTexts.forEach(text => {

    resultMap[text] =

      itemDictionary[text]?.[targetLang]

      ||

      translationCache[
        `${text}_${langCode}`
      ]

      ||

      text;

  });


  return resultMap;

}



function getMenuName(item){

  if(currentLanguage === "th"){
    return item.name;
  }


  if(
    itemDictionary[item.name]
    &&
    itemDictionary[item.name][currentLanguage]
  ){

    return itemDictionary[item.name][currentLanguage];

  }


  return

    translationCache[
      `${item.name}_${currentLanguage}`
    ]

    ||

    item[`name_${currentLanguage}`]

    ||

    item.name;

}

    item[`name_${currentLanguage}`]

    ||

    item.name;

}

async function changeLanguage(language){

  currentLanguage = language;


  localStorage.setItem(
    "orderLanguage",
    language
  );


  updateLanguageButtons();


  updateStaticTexts();


  if(language !== "th"){

    const allTexts = [

      ...menuData.map(
        item => item.name
      ),

      ...toppingData.map(
        item => item.name
      )

    ];


    await batchTranslateTexts(
      allTexts,
      language
    );

  }


  restartMenuRender();

}



function updateLanguageButtons(){

  ["th","my","zh","en"]
    .forEach(lang => {

      const button =
        document.getElementById(
          `lang-${lang}`
        );


      if(!button){
        return;
      }


      button.className =

        lang === currentLanguage

          ?

          "language-button rounded-lg border font-bold text-sm bg-amber-800 text-white"

          :

          "language-button rounded-lg border font-bold text-sm bg-white";

    });

}

/* =====================================================
   Load Data
===================================================== */

async function loadInitData(){

  try{


    const response =
      await fetch(
        "/api/init-data",
        {
          method:"GET",
          cache:"default"
        }
      );


    const data =
      await response.json();


    if(
      !response.ok
      ||
      !data.success
    ){

      throw new Error(
        data.error || "Load error"
      );

    }


    menuData =
      Array.isArray(data.menu)
        ? data.menu
        : [];


    toppingData =
      Array.isArray(data.toppings)
        ? data.toppings
        : [];


    if(currentLanguage !== "th"){

      const allTexts = [

        ...menuData.map(
          item => item.name
        ),

        ...toppingData.map(
          item => item.name
        )

      ];


      await batchTranslateTexts(
        allTexts,
        currentLanguage
      );

    }


    restartMenuRender();


  }catch(error){

    console.error(error);


    document
      .getElementById("menuContainer")
      .innerHTML =

      `<div class="col-span-full text-center p-10 text-red-600">

        ❌ ${escapeHTML(
          t("loadingError")
        )}

      </div>`;

  }

}



/* =====================================================
   Search
===================================================== */

document
  .getElementById("searchInput")
  .addEventListener(
    "input",
    () => {

      clearTimeout(searchTimer);


      searchTimer =
        setTimeout(
          () => {

            restartMenuRender();

          },

        );

    }

function getFilteredMenu(){

  const keyword =

    (
      document
        .getElementById("searchInput")
        ?.value

      ||

      ""
    )

    .toLowerCase()

    .trim();


  return menuData

    .map(
      (item,originalIndex) => ({

        item,
        originalIndex

      })
    )

    .filter(
      ({item}) => {

        if(!keyword){

          return true;

        }


        const originalName =

          String(
            item.name || ""
          )
          .toLowerCase();


        const translatedName =

          String(
            getMenuName(item) || ""
          )
          .toLowerCase();


        return

          originalName.includes(keyword)

          ||

          translatedName.includes(keyword);

      }
    );

}



/* =====================================================
   Lazy Render Menu
===================================================== */

function restartMenuRender(){

  const container =
    document.getElementById(
      "menuContainer"
    );


  if(menuObserver){

    menuObserver.disconnect();

    menuObserver = null;

  }


  filteredMenu =
    getFilteredMenu();


  renderedCount = 0;


  if(!filteredMenu.length){

    container.innerHTML =

      menuData.length

        ?

        `<div class="col-span-full text-center py-10 text-gray-500">

          ${escapeHTML(
            t("noMenuFound")
          )}

        </div>`

        :

        `<div class="col-span-full loading">

          ${escapeHTML(
            t("loadingError")
          )}

        </div>`;


    return;

  }


  container.innerHTML = "";


  renderNextMenuBatch();

}



function renderNextMenuBatch(){

  const container =
    document.getElementById(
      "menuContainer"
    );


  if(
    renderedCount
    >=
    filteredMenu.length
  ){

    return;

  }


  const fragment =
    document.createDocumentFragment();


  const end = Math.min(

    renderedCount
    +
    MENU_PAGE_SIZE,

    filteredMenu.length

  );


  for(

    let i = renderedCount;

    i < end;

    i++

  ){

    const {
      item,
      originalIndex
    }

    =
    filteredMenu[i];


    fragment.appendChild(

      createMenuCard(
        item,
        originalIndex
      )

    );

  }


  const oldSentinel =
    document.getElementById(
      "menuSentinel"
    );


  if(oldSentinel){

    oldSentinel.remove();

  }


  container.appendChild(
    fragment
  );


  renderedCount = end;


  if(
    renderedCount
    <
    filteredMenu.length
  ){

    const sentinel =
      document.createElement("div");


    sentinel.id =
      "menuSentinel";


    sentinel.setAttribute(
      "aria-hidden",
      "true"
    );


    container.appendChild(
      sentinel
    );


    setupMenuObserver();

  }

}



function setupMenuObserver(){

  if(menuObserver){

    menuObserver.disconnect();

    menuObserver = null;

  }


  const sentinel =
    document.getElementById(
      "menuSentinel"
    );


  if(!sentinel){

    return;

  }


  menuObserver =
    new IntersectionObserver(

      entries => {

        entries.forEach(
          entry => {

            if(

              entry.isIntersecting

              &&

              renderedCount
              <
              filteredMenu.length

            ){

              menuObserver.disconnect();

              menuObserver = null;


              requestAnimationFrame(
                () => {

                  renderNextMenuBatch();

                }
              );

            }

          }
        );

      },

      {

        root:null,

        rootMargin:"700px 0px",

        threshold:0

      }

    );


  menuObserver.observe(
    sentinel
  );

}



/* =====================================================
   Create Menu Card
===================================================== */

function createMenuCard(
  item,
  menuIndex
){

  const card =
    document.createElement("div");


  card.className =
    "menu-card p-2";


  const selected =
    selectedToppingsByMenu.get(
      menuIndex
    );


  const selectedCount =
    selected
      ? selected.size
      : 0;


  card.innerHTML = `


    <div>


      <div class="image-loading rounded-lg overflow-hidden">

        <img

          src="${escapeAttribute(
            item.image_url
            ||
            "https://via.placeholder.com/300"
          )}"

          class="menu-image"

          loading="lazy"

          decoding="async"

          alt=""

          onload="
            this.parentElement
            .classList
            .remove('image-loading')
          "

          onerror="
            this.parentElement
            .classList
            .remove('image-loading');

            this.onerror=null;

            this.src=
            'https://via.placeholder.com/300'
          "

        >

      </div>


      <div class="mt-2">

        <div
          class="font-bold text-sm text-gray-800 line-clamp-1">

          ${escapeHTML(
            getMenuName(item)
          )}

        </div>


        <div
          class="text-amber-800 font-extrabold mt-1">

          ${formatPrice(
            item.price
          )}

          ฿

        </div>

      </div>


      ${
        toppingData.length

        ?

        `

        <div class="topping-box mt-2">


          <button

            type="button"

            data-action="toggle-topping"

            data-menu-index="${menuIndex}"

            class="w-full text-xs font-bold text-amber-800 p-2 text-left flex justify-between items-center bg-amber-50 hover:bg-amber-100 transition">


            <span>

              ➕ ${escapeHTML(
                t("selectTopping")
              )}

            </span>


            <span

              id="topping-arrow-${menuIndex}"

              class="text-amber-700 text-sm font-normal">

              ▼

            </span>


          </button>


          <!-- ตอนแรกยังไม่สร้างรายการท็อปปิ้ง -->

          <div

            id="topping-list-${menuIndex}"

            class="hidden border-t topping-list-container">

          </div>


        </div>

        `

        :

        `

        <div
          class="text-xs text-gray-400 mt-2">

          ${escapeHTML(
            t("noTopping")
          )}

        </div>

        `
      }


      <div

        id="selected-${menuIndex}"

        class="selected-count mt-1.5 min-h-[16px]">


        ${
          selectedCount

          ?

          `${escapeHTML(
            t("selected")
          )} ${selectedCount}`

          :

          ""
        }


      </div>


    </div>


    <button

      data-action="add-cart"

      data-menu-index="${menuIndex}"

      class="order-button w-full bg-amber-800 text-white text-sm font-bold py-2 rounded-lg mt-2 active:bg-amber-900 active:scale-95 transition">


      ➕ ${escapeHTML(
        t("order")
      )}


    </button>


  `;


  card.addEventListener(

    "click",

    event => {


      const button =
        event.target.closest(
          "[data-action]"
        );


      if(!button){

        return;

      }


      const index =
        Number(
          button.dataset.menuIndex
        );


      if(

        button.dataset.action
        ===
        "toggle-topping"

      ){

        toggleTopping(index);

      }


      else if(

        button.dataset.action
        ===
        "add-cart"

      ){

        addToCart(index);

      }

    }

  );


  return card;

}



/* =====================================================
   Lazy Topping
===================================================== */

function renderToppings(
  menuIndex
){

  const list =
    document.getElementById(
      `topping-list-${menuIndex}`
    );


  if(

    !list

    ||

    list.dataset.rendered === "true"

  ){

    return;

  }


  const selected =

    selectedToppingsByMenu.get(
      menuIndex
    )

    ||

    new Set();


  const fragment =
    document.createDocumentFragment();


  toppingData.forEach(
    (top,topIndex) => {


      const label =
        document.createElement(
          "label"
        );


      label.className =
        "topping-item";


      label.innerHTML = `


        <input

          type="checkbox"

          class="topping-checkbox"

          data-menu-index="${menuIndex}"

          data-topping-index="${topIndex}"

          ${
            selected.has(topIndex)
              ? "checked"
              : ""
          }

        >


        <span
          class="text-xs flex-1">

          ${escapeHTML(
            getToppingName(top)
          )}

        </span>


        <span
          class="text-xs text-amber-700 whitespace-nowrap">

          +${formatPrice(
            top.price
          )}

          ฿

        </span>


      `;


      fragment.appendChild(
        label
      );

    }
  );


  list.appendChild(
    fragment
  );


  list.dataset.rendered =
    "true";


  list.addEventListener(

    "change",

    event => {


      const checkbox =
        event.target.closest(
          ".topping-checkbox"
        );


      if(!checkbox){

        return;

      }


      const index =
        Number(
          checkbox.dataset.menuIndex
        );


      const toppingIndex =
        Number(
          checkbox.dataset.toppingIndex
        );


      let selectedSet =
        selectedToppingsByMenu.get(
          index
        );


      if(!selectedSet){

        selectedSet =
          new Set();


        selectedToppingsByMenu.set(
          index,
          selectedSet
        );

      }


      if(checkbox.checked){

        selectedSet.add(
          toppingIndex
        );

      }

      else{

        selectedSet.delete(
          toppingIndex
        );


        if(
          selectedSet.size === 0
        ){

          selectedToppingsByMenu.delete(
            index
          );

        }

      }


      updateSelectedCount(
        index
      );

    }

  );

}



function toggleTopping(
  menuIndex
){

  const list =
    document.getElementById(
      `topping-list-${menuIndex}`
    );


  const arrow =
    document.getElementById(
      `topping-arrow-${menuIndex}`
    );


  if(!list){

    return;

  }


  if(
    list.classList.contains(
      "hidden"
    )
  ){

    /* สร้างตอนกดเปิดครั้งแรก */
    renderToppings(
      menuIndex
    );


    list.classList.remove(
      "hidden"
    );


    if(arrow){

      arrow.innerText = "▲";

    }

  }

  else{

    list.classList.add(
      "hidden"
    );


    if(arrow){

      arrow.innerText = "▼";

    }

  }

}



function updateSelectedCount(
  menuIndex
){

  const selected =
    selectedToppingsByMenu.get(
      menuIndex
    );


  const display =
    document.getElementById(
      `selected-${menuIndex}`
    );


  if(display){

    const count =
      selected
        ? selected.size
        : 0;


    display.innerText =
      count

      ?

      `${t("selected")} ${count}`

      :

      "";

  }

}



function getSelectedToppings(
  menuIndex
){

  const selected =
    selectedToppingsByMenu.get(
      menuIndex
    );


  if(

    !selected

    ||

    !selected.size

  ){

    return [];

  }


  return

    Array
      .from(selected)

      .map(
        topIndex => {

          const topping =
            toppingData[topIndex];


          if(!topping){

            return null;

          }


          return {

            name:
              topping.name,

            price:
              Number(
                topping.price
              )

          };

        }
      )

      .filter(Boolean);

}



/* =====================================================
   Cart
===================================================== */

function addToCart(
  menuIndex
){

  const item =
    menuData[menuIndex];


  if(!item){

    return;

  }


  const toppings =
    getSelectedToppings(
      menuIndex
    );


  const totalPrice =

    Number(item.price)

    +

    toppings.reduce(

      (sum,topping) =>

        sum

        +

        Number(
          topping.price
        ),

      0

    );


  cart.push({

    menu_name:
      item.name,

    price:
      Number(
        item.price
      ),

    toppings:
      toppings,

    total_price:
      totalPrice

  });


  resetToppingsForMenu(
    menuIndex
  );


  updateCartUI();

}



function removeFromCart(
  index
){

  cart.splice(
    index,
    1
  );


  updateCartUI();


  renderCartModal();


  if(!cart.length){

    closeCartModal();

  }

}



function clearCart(){

  cart = [];


  updateCartUI();


  closeCartModal();

}



function openCartModal(){

  if(!cart.length){

    return;

  }


  renderCartModal();


  document
    .getElementById("cartModal")
    .classList
    .remove("hidden");

}



function closeCartModal(){

  document
    .getElementById("cartModal")
    .classList
    .add("hidden");

}



function renderCartModal(){

  const container =
    document.getElementById(
      "cartItemsList"
    );


  if(!cart.length){

    container.innerHTML =

      `<div class="text-center py-6 text-gray-400">

        ${escapeHTML(
          t("emptyCart")
        )}

      </div>`;


    return;

  }


  container.innerHTML =

    cart.map(
      (item,index) => {


        const name =
          getMenuName({
            name:
              item.menu_name
          });


        const toppingsList =

          item.toppings

            .map(
              top =>

                getToppingName({
                  name:
                    top.name
                })
            )

            .join(", ");


        return `


          <div
            class="py-2.5 flex justify-between items-center gap-2">


            <div class="flex-1">


              <div
                class="font-bold text-sm text-gray-800">

                ${escapeHTML(
                  name
                )}

              </div>


              ${
                toppingsList

                ?

                `<div
                  class="text-xs text-amber-700 mt-0.5">

                  +

                  ${escapeHTML(
                    toppingsList
                  )}

                </div>`

                :

                ""
              }


              <div
                class="text-xs font-bold text-amber-900 mt-1">

                ${formatPrice(
                  item.total_price
                )}

                ฿

              </div>


            </div>


            <button

              onclick="removeFromCart(${index})"

              class="bg-red-50 text-red-600 px-3 py-1.5 rounded-lg text-xs font-bold border border-red-200 hover:bg-red-100 active:scale-95 transition">


              🗑️ ${escapeHTML(
                t("remove")
              )}


            </button>


          </div>


        `;

      }
    )

    .join("");

}



function resetToppingsForMenu(
  menuIndex
){

  selectedToppingsByMenu.delete(
    menuIndex
  );


  const list =
    document.getElementById(
      `topping-list-${menuIndex}`
    );


  const display =
    document.getElementById(
      `selected-${menuIndex}`
    );


  const arrow =
    document.getElementById(
      `topping-arrow-${menuIndex}`
    );


  if(list){

    list.innerHTML = "";


    delete list.dataset.rendered;


    list.classList.add(
      "hidden"
    );

  }


  if(display){

    display.innerText = "";

  }


  if(arrow){

    arrow.innerText = "▼";

  }

}



function resetAllForm(){

  cart = [];


  selectedToppingsByMenu.clear();


  const input =
    document.getElementById(
      "tableNo"
    );


  input.value =

    currentLanguage === "th"

      ?

      "สั่งกลับบ้าน"

      :

      "";


  document
    .getElementById("searchInput")
    .value = "";


  setDefaultDate();


  updateCartUI();


  restartMenuRender();

}



function updateCartUI(){

  const count =
    cart.length;


  const total =

    cart.reduce(

      (sum,item) =>

        sum

        +

        Number(
          item.total_price
        ),

      0

    );


  document
    .getElementById("cartLabel")
    .innerHTML =

    `<span>

      ${escapeHTML(
        t("total")
      )}

      (

      <span id="cartCount">

        ${count}

      </span>

      ${escapeHTML(
        t("item")
      )}

      )

    </span>

    <span
      class="text-[10px] text-amber-800 font-bold">

      ${escapeHTML(
        t("viewDelete")
      )}

    </span>`;


  document
    .getElementById("cartTotal")
    .innerText =
      formatPrice(total);

}



/* =====================================================
   Submit Order
===================================================== */

async function submitOrder(){

  if(submitting){

    return;

  }


  const tableNo =

    document
      .getElementById("tableNo")
      .value
      .trim();


  const orderDate =

    document
      .getElementById("orderDate")
      .value;


  if(!tableNo){

    alert(
      t("enterCustomer")
    );


    return;

  }


  if(!cart.length){

    alert(
      t("emptyCart")
    );


    return;

  }


  const total =

    cart.reduce(

      (sum,item) =>

        sum

        +

        Number(
          item.total_price
        ),

      0

    );


  submitting = true;


  const button =
    document.getElementById(
      "submitButton"
    );


  button.disabled = true;


  button.classList.add(
    "opacity-60"
  );


  document
    .getElementById("submitText")
    .innerText =
      t("sending");


  const formattedCart =

    cart.map(
      item => {


        const toppingNames =

          item.toppings

          ?

          item.toppings

            .map(
              top =>
                top.name
            )

            .join(", ")

          :

          "";


        const fullName =

          toppingNames

          ?

          `${item.menu_name} (+${toppingNames})`

          :

          item.menu_name;


        return {

          name:
            fullName,

          display_name:
            fullName,

          price:
            item.total_price,

          cost:
            item.price

        };

      }
    );


  try{


    const response =

      await fetch(

        "/api/order",

        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:

            JSON.stringify({

              table_number:
                tableNo,

              cart:
                formattedCart,

              total_price:
                total,

              order_date:
                orderDate

            })

        }

      );


    const data =
      await response.json();


    if(

      !response.ok

      ||

      !data.success

    ){

      throw new Error(

        data.error
        ||
        "Order error"

      );

    }


    resetAllForm();


    alert(
      t("success")
    );


  }catch(error){


    console.error(
      error
    );


    alert(

      t("error")

      +

      "\n"

      +

      error.message

    );


  }finally{


    submitting = false;


    button.disabled = false;


    button.classList.remove(
      "opacity-60"
    );


    document
      .getElementById("submitText")
      .innerText =
        t("confirm");

  }

}



/* =====================================================
   Utility
===================================================== */

function formatPrice(
  price
){

  return

    (
      Number(price)
      ||
      0
    )

    .toLocaleString(

      "en-US",

      {
        maximumFractionDigits:2
      }

    );

}



function escapeHTML(
  value
){

  if(

    value === null

    ||

    value === undefined

  ){

    return "";

  }


  return

    String(value)

      .replaceAll(
        "&",
        "&amp;"
      )

      .replaceAll(
        "<",
        "&lt;"
      )

      .replaceAll(
        ">",
        "&gt;"
      )

      .replaceAll(
        '"',
        "&quot;"
      )

      .replaceAll(
        "'",
        "&#039;"
      );

}



function escapeAttribute(
  value
){

  return escapeHTML(
    value
  );

}
